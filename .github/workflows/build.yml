name: Build MyDownloader APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create project architecture
        run: |
          mkdir -p app/src/main/java/com/mm/mydownloader app/src/main/res/values

          # 1. settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = "MyDownloader"
          include ':app'
          EOF

          # 2. root build.gradle
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 3. app build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.mm.mydownloader'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mm.mydownloader"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
              implementation "io.github.junkfood02.youtubedl-android:library:0.17.0"
              implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.17.0"
          }
          EOF

          # 4. strings.xml & themes.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources><string name="app_name">MyDownloader</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml << 'EOF'
          <resources><style name="Theme.MyDownloader" parent="Theme.AppCompat.Light.NoActionBar"/></resources>
          EOF

          # 5. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <application android:name=".App" android:label="@string/app_name" android:theme="@style/Theme.MyDownloader" android:requestLegacyExternalStorage="true">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. App.kt
          cat > app/src/main/java/com/mm/mydownloader/App.kt << 'EOF'
          package com.mm.mydownloader
          import android.app.Application
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          object EngineState { @Volatile var ready = false }
          class App : Application() {
              override fun onCreate() {
                  super.onCreate()
                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          YoutubeDL.getInstance().init(applicationContext)
                          FFmpeg.getInstance().init(applicationContext)
                          EngineState.ready = true
                      } catch (e: Exception) { e.printStackTrace() }
                  }
              }
          }
          EOF

          # 7. MainActivity.kt (Compact Version)
          cat > app/src/main/java/com/mm/mydownloader/MainActivity.kt << 'EOF'
          package com.mm.mydownloader
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.LinearLayout
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.AdView
          import com.google.android.gms.ads.MobileAds
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate()
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      webViewClient = WebViewClient()
                  }
                  val adView = AdView(this).apply {
                      setAdSize(com.google.android.gms.ads.AdSize.BANNER)
                      adUnitId = "ca-app-pub-3940256099942544/6300978111"
                  }
                  root.addView(webView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  root.addView(adView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  setContentView(root)
                  MobileAds.initialize(this) {}
                  adView.loadAd(AdRequest.Builder().build())
                  webView.loadUrl("https://google.com")
                  Toast.makeText(this, "Welcome to MyDownloader", Toast.LENGTH_LONG).show()
              }
          }
          EOF

      - name: Build Android App
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mydownloader-apk
          path: app/build/outputs/apk/debug/app-debug.apk
